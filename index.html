<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meter Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef1;--card:#fff;--ink:#12263a;--mut:#5b6b7a;--line:#cdd7de;--acc:#0b6e8a;--acc2:#e8a317;--bad:#b3261e;--ok:#1b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c27;--card:#172a38;--ink:#e6eef3;--mut:#93a6b5;--line:#2a4254;--acc:#4cc2e0;--acc2:#f2b73f;--bad:#ff8a80;--ok:#6fd49b}}
:root[data-theme="dark"]{--bg:#0f1c27;--card:#172a38;--ink:#e6eef3;--mut:#93a6b5;--line:#2a4254;--acc:#4cc2e0;--acc2:#f2b73f;--bad:#ff8a80;--ok:#6fd49b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,.num{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 1px;font:inherit;font-size:12px;cursor:pointer}
nav button[aria-current=true]{color:var(--acc);font-weight:500;box-shadow:inset 0 3px var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.dial{background:color-mix(in srgb,var(--acc) 20%,var(--card));color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.dial .num{font-size:44px;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--acc2)}
.dial small{color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:20px;font-family:'Bricolage Grotesque',sans-serif}.stat span{color:var(--mut);font-size:13px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.p{background:var(--acc);color:var(--onacc,#fff);border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:500;cursor:pointer;margin-top:12px}
:root[data-theme="dark"] button.p{color:#06202a}
button.s{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.l{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:2px 6px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
tr.void td{text-decoration:line-through;color:var(--mut)}
.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:14px}.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.okm{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.prev{border-left:4px solid var(--acc2);padding:8px 12px;margin-top:12px;background:var(--bg);border-radius:0 8px 8px 0;font-variant-numeric:tabular-nums}

<script>
const KEY='meterLedger.v1';
let S={typeRates:{},sites:[],meters:[],active:null,meter:null,numHist:[],rates:[],readings:[],audit:[],cur:'৳',dec:2},adding=false,siteSel=null,lastDate=null;
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(!d.meters&&d.meter){d.meters=[Object.assign({},d.meter,{numHist:d.numHist||[],rates:d.rates||[],readings:d.readings||[]})];d.active=d.meter.id}
 S.meters=d.meters||[];S.sites=d.sites||[];S.typeRates=d.typeRates||{};S.active=d.active;S.audit=d.audit||[];S.cur=(d.cur&&d.cur!=='\u20b9')?d.cur:'৳';S.dec=d.dec??S.dec}}catch(e){}
function use(id){const x=S.meters.find(q=>q.id===id)||S.meters[0];if(x){siteSel=x.site;S.active=x.id;S.meter=x;S.rates=x.rates;S.readings=x.readings;S.numHist=x.numHist}else S.meter=null}
function fix(){if(S.meters.length&&!S.sites.length)S.sites=[{id:uid(),name:'Home',type:'Home'}];S.meters.forEach(x=>{if(!x.site||!S.sites.some(q=>q.id===x.site))x.site=S.sites[0].id})}
fix();use(S.active);const snap=()=>({typeRates:S.typeRates,sites:S.sites,meters:S.meters,active:S.active,audit:S.audit,cur:S.cur,dec:S.dec});
let tab='home',flash=null,filt={f:'',t:''},csvText='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}};
function uid(){return Math.random().toString(36).slice(2,10)}
const log=(a,d)=>{S.audit.unshift({at:new Date().toISOString(),a,d:(S.meter?S.meter.name+': ':'')+d})};
const m=n=>(+n).toLocaleString(undefined,{minimumFractionDigits:S.dec,maximumFractionDigits:S.dec});
const u=n=>(+n).toLocaleString(undefined,{maximumFractionDigits:3});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const rates=()=>[...S.rates].sort((a,b)=>a.from.localeCompare(b.from));
const rateFor=d=>{let r=null;for(const x of rates())if(x.from<=d)r=x;return r};
const valid=()=>S.readings.filter(r=>r.status!=='VOID').sort((a,b)=>a.date.localeCompare(b.date));
function recalc(){let p=null;for(const r of valid()){r.prev=p?p.present:(r.open??null);r.units=r.prev==null?0:r.present-r.prev;r.charge=+(r.units*r.rate).toFixed(4);p=r}}
function modal(inner){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="mb" role="dialog" aria-modal="true">'+inner+'</div>';document.body.appendChild(o);return o}
function confirmBox(msg,fn){const o=modal('<p style="margin-top:0">'+esc(msg)+'</p><div class="row"><button class="s" data-x="1">Cancel</button><button class="p d" data-k="1" style="margin-top:0">Confirm</button></div>');o.querySelector('[data-x]').onclick=()=>o.remove();o.querySelector('[data-k]').onclick=()=>{o.remove();fn()}}
function inputBox(msg,def,fn){const o=modal('<p style="margin-top:0">'+esc(msg)+'</p><input id="ib" inputmode="decimal" value="'+esc(def)+'"><div class="row" style="margin-top:12px"><button class="s" data-x="1">Cancel</button><button class="p" data-k="1" style="margin-top:0">Save</button></div>');o.querySelector('[data-x]').onclick=()=>o.remove();o.querySelector('[data-k]').onclick=()=>{const v=o.querySelector('#ib').value;o.remove();fn(v)}}
function editMeter(id){const x=S.meters.find(y=>y.id===id);if(!x)return;
 const o=modal('<h2>Edit meter</h2><label>Meter name</label><input id="em1" value="'+esc(x.name)+'"><label>Meter number</label><input id="em2" value="'+esc(x.number)+'"><div class="row"><div><label>Unit</label><input id="em3" value="'+esc(x.unit)+'"></div><div><label>Site</label><select id="em4">'+S.sites.map(z=>'<option value="'+z.id+'"'+(z.id===x.site?' selected':'')+'>'+esc(z.name)+'</option>').join('')+'</select></div></div><div id="emr"></div><div class="row" style="margin-top:12px"><button class="s" data-x="1">Cancel</button><button class="p" data-k="1" style="margin-top:0">Save</button></div>');
 const g=k=>o.querySelector('#'+k).value;o.querySelector('[data-x]').onclick=()=>o.remove();
 o.querySelector('[data-k]').onclick=()=>{const nm=g('em1').trim(),num=g('em2').trim(),err=t=>{o.querySelector('#emr').innerHTML='<div class="msg err">'+t+'</div>'};
  if(!nm||!num){err('Name and meter number are required.');return}
  if(num!==x.number&&S.meters.some(y=>y.id!==x.id&&y.number===num)){err('That meter number is already used.');return}
  if(num!==x.number){const now=new Date().toISOString();x.numHist[x.numHist.length-1].to=now;x.numHist.push({n:num,from:now,to:null});log('METER_NUMBER_CHANGED',x.number+' → '+num);x.number=num}
  x.name=nm;x.unit=g('em3').trim()||'kWh';x.site=g('em4');if(S.active===x.id)siteSel=x.site;log('METER_EDITED',nm);save();o.remove();flash={ok:1,t:'Meter saved.'};render()}}
const PRESETS={navy:{n:'Navy',bg:'#0f1c27',card:'#172a38',ink:'#e6eef3',acc:'#4cc2e0',acc2:'#f2b73f'},light:{n:'Light',bg:'#e9eef1',card:'#ffffff',ink:'#12263a',acc:'#0b6e8a',acc2:'#e8a317'},sunset:{n:'Sunset',bg:'#2a1620',card:'#3a2030',ink:'#fbeee6',acc:'#ff8a4c',acc2:'#ffd166'},forest:{n:'Forest',bg:'#10211a',card:'#17302a',ink:'#e8f3ec',acc:'#5fd39a',acc2:'#f2c14e'},purple:{n:'Purple',bg:'#1a1530',card:'#262045',ink:'#eeeaff',acc:'#a78bfa',acc2:'#fbbf24'},slate:{n:'Slate',bg:'#1c1f24',card:'#272b32',ink:'#eceff3',acc:'#7aa2ff',acc2:'#ffb454'}};
const hex=v=>/^#[0-9a-f]{6}$/i.test((v||'').trim())?v.trim():null;
const lum=h=>{const n=parseInt(h.slice(1),16),f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
function saveTheme(){try{if(S.theme)localStorage.setItem('meterLedger.theme',JSON.stringify(S.theme));else localStorage.removeItem('meterLedger.theme')}catch(e){}}
function applyTheme(){const r=document.documentElement.style,t=S.theme;['--bg','--card','--ink','--acc','--acc2','--mut','--line','--onacc','--img','--tint'].forEach(k=>r.removeProperty(k));
 let acc=t&&t.acc;if(!acc){try{acc=hex(getComputedStyle(document.documentElement).getPropertyValue('--acc'))}catch(e){}}
 if(acc)r.setProperty('--onacc',lum(acc)>.4?'#0b1620':'#ffffff');
 if(!t)return;
 r.setProperty('--bg',t.bg);r.setProperty('--card',t.card);r.setProperty('--ink',t.ink);r.setProperty('--acc',t.acc);r.setProperty('--acc2',t.acc2);
 r.setProperty('--mut','color-mix(in srgb,'+t.ink+' 62%,'+t.bg+')');r.setProperty('--line','color-mix(in srgb,'+t.ink+' 22%,'+t.bg+')');r.setProperty('--tint',(t.tint||0)/100);
 if(t.img==='none')r.setProperty('--img','none');else if(t.img==='custom'&&t.custom)r.setProperty('--img','url('+t.custom+')')}
function curTheme(){if(S.theme)return Object.assign({img:'default',tint:0},S.theme);let c={};try{const g=k=>hex(getComputedStyle(document.documentElement).getPropertyValue(k));c={bg:g('--bg'),card:g('--card'),ink:g('--ink'),acc:g('--acc'),acc2:g('--acc2')}}catch(e){}
 const d=PRESETS.navy;return{bg:c.bg||d.bg,card:c.card||d.card,ink:c.ink||d.ink,acc:c.acc||d.acc,acc2:c.acc2||d.acc2,img:'default',tint:0}}
function openTheme(){let t=curTheme();
 const o=modal('<h2>Theme</h2><label>Ready-made themes</label><div style="display:flex;flex-wrap:wrap;gap:8px">'+Object.keys(PRESETS).map(k=>'<button class="s" data-p="'+k+'" style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:'+PRESETS[k].acc+';border:2px solid '+PRESETS[k].bg+'"></span>'+PRESETS[k].n+'</button>').join('')+'</div><div class="row"><div><label>Accent</label><input type="color" id="tc-acc"></div><div><label>Highlight</label><input type="color" id="tc-acc2"></div></div><div class="row"><div><label>Background</label><input type="color" id="tc-bg"></div><div><label>Cards</label><input type="color" id="tc-card"></div></div><label>Text</label><input type="color" id="tc-ink"><label>Background picture</label><select id="ti"><option value="default">Power lines</option><option value="none">None</option><option value="custom">My own image</option></select><input type="file" accept="image/*" id="tf" style="margin-top:8px"><label>Picture dimming <span id="tv"></span></label><input type="range" id="tt" min="0" max="90"><div class="row" style="margin-top:14px"><button class="s" data-r="1">Reset to default</button><button class="p" data-k="1" style="margin-top:0">Done</button></div>');
 const q=x=>o.querySelector(x),keys=['acc','acc2','bg','card','ink'];
 const sync=()=>{keys.forEach(k=>q('#tc-'+k).value=t[k]);q('#ti').value=t.img;q('#tt').value=t.tint||0;q('#tv').textContent=(t.tint||0)+'%'};
 const upd=()=>{S.theme=Object.assign({},t);applyTheme();saveTheme()};
 sync();
 o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PRESETS[b.dataset.p];keys.forEach(k=>t[k]=p[k]);sync();upd()});
 keys.forEach(k=>q('#tc-'+k).oninput=e=>{t[k]=e.target.value;upd()});
 q('#ti').onchange=e=>{t.img=e.target.value;if(t.img==='custom'&&!t.custom)q('#tf').click();upd()};
 q('#tt').oninput=e=>{t.tint=+e.target.value;q('#tv').textContent=t.tint+'%';upd()};
 q('#tf').onchange=()=>{const f=q('#tf').files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);t.custom=c.toDataURL('image/jpeg',.75);t.img='custom';q('#ti').value='custom';upd()};im.src=fr.result};fr.readAsDataURL(f)};
 q('[data-r]').onclick=()=>{S.theme=null;applyTheme();saveTheme();o.remove()};
 q('[data-k]').onclick=()=>o.remove()}
document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('#tb');if(b)openTheme()});
function tabs(){const t=[['home','Home'],['add','Add'],['hist','History'],['rates','Rates'],['rep','Reports'],['sites','Sites'],['set','Settings']];
 const n=document.getElementById('nav');n.hidden=!S.sites.length;n.innerHTML=(S.meter?t:t.filter(x=>x[0]==='sites')).map(([k,l])=>`<button data-t="${k}" aria-current="${tab===k}">${l}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;flash=null;render()})}
const fl=()=>flash?`<div class="msg ${flash.ok?'okm':'err'}" role="alert">${esc(flash.t)}</div>`:'';
function render(){document.getElementById('types').innerHTML=[...new Set(['Home','Market','Shop','Office','Factory','Apartment',...S.sites.map(x=>x.type).filter(Boolean)])].map(t=>`<option value="${esc(t)}">`).join('');if(S.sites.length&&!S.sites.some(x=>x.id===siteSel))siteSel=S.sites[0].id;if(S.meter&&!adding&&tab!=='sites'&&S.meter.site!==siteSel)tab='sites';if(!S.meter&&S.sites.length&&!adding)tab='sites';tabs();const a=document.getElementById('app');
 if(!S.sites.length){a.innerHTML=siteFirst();bindSiteFirst();return}
 if(adding){a.innerHTML=setup();bindSetup();return}
 a.innerHTML=`<header><h1>Meter Ledger</h1><span style="display:flex;gap:6px"><button class="s" id="tb" aria-label="Theme">🎨</button><button class="s" id="am">+ Add meter</button></span></header><div class="row" style="margin-bottom:14px"><div><label for="st" style="margin-top:0">Site</label><select id="st">${[...new Set(S.sites.map(x=>x.type||'Other'))].map(ty=>`<optgroup label="${esc(ty)}">${S.sites.filter(x=>(x.type||'Other')===ty).map(x=>`<option value="${x.id}" ${x.id===siteSel?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('')}</select></div><div><label for="sw" style="margin-top:0">Meter</label><select id="sw">${S.meters.filter(x=>x.site===siteSel).map(x=>`<option value="${x.id}" ${x.id===S.active?'selected':''}>${esc(x.name)} · ${esc(x.number)}</option>`).join('')||'<option>No meters yet</option>'}</select></div></div>`+({home,add,hist,rates:rate,rep,sites,set}[tab])();
 document.getElementById('am').onclick=()=>{adding=true;flash=null;render()};document.getElementById('st').onchange=e=>{siteSel=e.target.value;const f=S.meters.find(x=>x.site===siteSel);if(f)use(f.id);else tab='sites';save();flash=null;render()};document.getElementById('sw').onchange=e=>{use(e.target.value);save();flash=null;filt={f:'',t:''};render()};
 ({home:()=>{},add:bindAdd,hist:bindHist,rates:bindRate,rep:bindRep,sites:bindSites,set:bindSet}[tab]||(()=>{}))()}
function siteFirst(){return `<div style="display:flex;justify-content:space-between;align-items:center"><h1>Create your first site</h1><button class="s" id="tb">🎨 Theme</button></div><div class="card"><p style="color:var(--mut);margin-top:0">A site is a place such as a home or a shop. Create the site first, then add its meters and unit rate.</p><label for="fn">Site name</label><input id="fn" placeholder="e.g. Home 1, Shop A"><label for="ft2">Site type</label><input id="ft2" list="types" placeholder="Home, Shop…"><button class="p" id="fg">Create site</button><div id="fe">${fl()}</div></div>`}
function bindSiteFirst(){fg.onclick=()=>{const n=fn.value.trim();if(!n){fe.innerHTML='<div class="msg err">Site name is required.</div>';return}const x={id:uid(),name:n,type:ft2.value.trim()||'Home'};S.sites.push(x);siteSel=x.id;log('SITE_ADDED',n);save();tab='sites';flash={ok:1,t:'Site created. Now add its meters below.'};render()}}
function setup(){return `<h1>Set up your meter</h1><div class="card"><p style="color:var(--mut);margin-top:0">Enter your meter number once. You can edit it later and every change is logged.</p>
<label for="mn">Meter number</label><input id="mn" placeholder="e.g. MTR-001">${S.sites.length?`<label for="ms">Site</label><select id="ms">${S.sites.map(x=>`<option value="${x.id}" ${x.id===siteSel?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'<label for="s0">Site name</label><input id="s0" placeholder="e.g. Home 1, Market A"><label for="s1">Site type</label><input id="s1" list="types" placeholder="Home, Market, Factory…">'}<label for="dn">Meter name</label><input id="dn" placeholder="e.g. Flat 1, Shop 3">
<label for="mr">Unit rate (${S.cur} per kWh)</label><input id="mr" inputmode="decimal" placeholder="e.g. 12 (blank = type default)"><label for="me">Rate effective from</label><input type="date" id="me" value="${today()}"><button class="p" id="go">Create meter</button> <button class="s" id="cn" style="margin-top:12px">Cancel</button><div id="e"></div></div>`}

 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const x=S.meters.find(y=>y.id===b.dataset.d);if(!x)return;confirmBox('Delete meter "'+x.name+'" ('+x.number+') with all its readings and rates? This cannot be undone. Consider a backup first.',()=>{
  log('METER_DELETED',x.name+' ('+x.number+')');S.meters=S.meters.filter(y=>y.id!==x.id);
  if(S.active===x.id){const f=S.meters.find(y=>y.site===x.site)||S.meters[0];if(f)use(f.id);else{S.meter=null;S.active=null;S.rates=[];S.readings=[];S.numHist=[]}}
  save();flash={ok:1,t:'Meter deleted.'};render()})});
 asb.onclick=()=>{const n=sn1.value.trim();if(!n){flash={t:'Enter a site name.'};render();return}const x={id:uid(),name:n,type:stp.value};S.sites.push(x);siteSel=x.id;log('SITE_ADDED',n);save();flash={ok:1,t:'Site added. Add its meters below.'};render()};
 bb.onclick=()=>{const c=parseInt(bc.value),st=parseInt(bs.value),r=isNaN(parseFloat(br.value))?S.typeRates[cs.type]:parseFloat(br.value);
  if(!(c>=1&&c<=500)||isNaN(st)||isNaN(r)||r<0||!bn.value.trim()){flash={t:'Enter a count (1 to 500), name prefix, start number and a rate of 0 or more.'};render();return}
  if(cs.type&&S.typeRates[cs.type]==null)S.typeRates[cs.type]=r;const now=new Date().toISOString();let k=0;
  for(let i=0;i<c;i++){const n=bp.value+(st+i);if(S.meters.some(y=>y.number===n))continue;S.meters.push({id:uid(),site:siteSel,number:n,name:bn.value.trim()+' '+(st+i),unit:'kWh',numHist:[{n,from:now,to:null}],rates:[{id:uid(),rate:r,from:be.value||today()}],readings:[]});k++}
  if(!S.meter)use(S.meters[0].id);log('METERS_BULK_ADDED',k+' meters');save();flash=k?{ok:1,t:k+' meters created'+(k<c?' ('+(c-k)+' skipped: number already exists).':'.')}:{t:'No meters created: those numbers already exist.'};render()}}
function rep(){const mm={};valid().forEach(r=>{const k=r.date.slice(0,7);(mm[k]=mm[k]||{u:0,c:0,n:0}).u+=r.units;mm[k].c+=r.charge;mm[k].n++});
 const ks=Object.keys(mm).sort(),tu=ks.reduce((s,k)=>s+mm[k].u,0),tc=ks.reduce((s,k)=>s+mm[k].c,0);
 return `<div class="card tw"><h2>Monthly summary</h2>${ks.length?`<table><tr><th>Month</th><th>Readings</th><th>Units</th><th>Cost</th></tr>${ks.map(k=>`<tr><td>${k}</td><td>${mm[k].n}</td><td>${u(mm[k].u)}</td><td>${m(mm[k].c)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td><b>${u(tu)}</b></td><td><b>${S.cur}${m(tc)}</b></td></tr></table>`:'<div class="empty">Add readings to see reports.</div>'}</div>
 <div class="card"><h2>Export CSV</h2><button class="s" id="cx">Generate CSV</button><textarea id="ct" rows="6" readonly hidden></textarea><button class="s" id="cc" hidden>Copy</button></div>`}
function bindRep(){cx.onclick=()=>{csvText='date,previous,present,units,rate,charge,status\n'+valid().map(r=>[r.date,r.prev??'',r.present,r.units,r.rate,r.charge,r.status].join(',')).join('\n');ct.value=csvText;ct.hidden=cc.hidden=false};
 cc.onclick=()=>{ct.select();try{navigator.clipboard.writeText(csvText);cc.textContent='Copied'}catch(e){document.execCommand('copy')}}}
function set(){return fl()+`<div class="card"><h2>Meter</h2><label for="en">Meter number</label><input id="en" value="${esc(S.meter.number)}"><button class="p" id="sn">Update meter number</button>
<h2 style="margin-top:18px">Number history</h2>${S.numHist.map(h=>`<div>${esc(h.n)} <span style="color:var(--mut)">from ${h.from.slice(0,10)}${h.to?' to '+h.to.slice(0,10):' (current)'}</span></div>`).join('')}</div>
<div class="card"><h2>Meter details</h2><label for="mnm">Meter name</label><input id="mnm" value="${esc(S.meter.name)}"><div class="row"><div><label for="mun">Unit</label><input id="mun" value="${esc(S.meter.unit)}"></div><div><label for="msi">Site</label><select id="msi">${S.sites.map(x=>`<option value="${x.id}" ${x.id===S.meter.site?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><button class="p" id="mdv">Save details</button> <button class="s" id="mdl" style="margin-top:12px;color:var(--bad)">Delete meter</button></div>
<div class="card"><h2>Currency</h2><div class="row"><div><label for="cu">Symbol</label><input id="cu" value="${esc(S.cur)}" maxlength="3"></div><div><label for="dc">Decimals</label><select id="dc">${[0,2,3].map(d=>`<option ${d===S.dec?'selected':''}>${d}</option>`).join('')}</select></div></div><button class="s" id="sc" style="margin-top:12px">Save</button></div>
<div class="card"><h2>Backup</h2><button class="s" id="bk">Show backup data</button> <button class="s" id="rs">Restore from pasted data</button><textarea id="bt" rows="5" hidden></textarea></div>
<div class="card"><h2>Audit trail</h2>${S.audit.length?S.audit.slice(0,30).map(a=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)">${a.at.slice(0,16).replace('T',' ')} · <b>${a.a}</b> ${esc(a.d)}</div>`).join(''):'<div class="empty">No events yet.</div>'}</div>`}
function bindSet(){mdv.onclick=()=>{const n=mnm.value.trim();if(!n){flash={t:'Meter name cannot be empty.'};render();return}S.meter.name=n;S.meter.unit=mun.value.trim()||'kWh';S.meter.site=msi.value;siteSel=msi.value;log('METER_EDITED',n);save();flash={ok:1,t:'Meter details saved.'};render()};
 mdl.onclick=()=>confirmBox('Delete meter "'+S.meter.name+'" with all its readings and rates? This cannot be undone. Consider a backup first.',()=>{log('METER_DELETED',S.meter.number);const id=S.meter.id,sid=S.meter.site;S.meters=S.meters.filter(y=>y.id!==id);const f=S.meters.find(y=>y.site===sid)||S.meters[0];if(f)use(f.id);else{S.meter=null;S.active=null;S.rates=[];S.readings=[];S.numHist=[]}save();flash={ok:1,t:'Meter deleted.'};render()});
 sn.onclick=()=>{const n=en.value.trim();if(!n){flash={t:'Meter number cannot be empty.'};render();return}if(n===S.meter.number)return;
 const now=new Date().toISOString();S.numHist[S.numHist.length-1].to=now;S.numHist.push({n,from:now,to:null});log('METER_NUMBER_CHANGED',S.meter.number+' → '+n);S.meter.number=n;save();flash={ok:1,t:'Meter number updated and logged.'};render()};
 sc.onclick=()=>{S.cur=cu.value||'৳';S.dec=+dc.value;save();flash={ok:1,t:'Saved.'};render()};
 bk.onclick=()=>{bt.hidden=false;bt.value=JSON.stringify(snap())};
 rs.onclick=()=>{if(bt.hidden){bt.hidden=false;bt.value='';bt.placeholder='Paste backup data, then press Restore again';return}
  try{const d=JSON.parse(bt.value);if(!Array.isArray(d.meters))throw 0;S.meters=d.meters;S.sites=d.sites||[];S.typeRates=d.typeRates||{};fix();S.audit=d.audit||[];S.cur=(d.cur&&d.cur!=='\u20b9')?d.cur:'৳';S.dec=d.dec??S.dec;use(d.active);save();flash={ok:1,t:'Backup restored.'}}catch(e){flash={t:'That backup data is not valid.'}}render()}}
render();
</script></body></html>
